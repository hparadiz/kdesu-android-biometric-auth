plugins { id 'com.android.application' }

android {
    namespace 'in.akuj.fingerprint'
    compileSdk 34
    defaultConfig {
        applicationId 'in.akuj.fingerprint'
        minSdk 28
        targetSdk 34
        versionCode 12
        versionName '0.8.3'
    }
    buildTypes {
        release { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
