plugins { id 'com.android.application' }

android {
    namespace 'in.akuj.fingerprint'
    compileSdk 34
    defaultConfig {
        applicationId 'in.akuj.fingerprint'
        minSdk 28
        targetSdk 34
        versionCode 17
        versionName '0.11.0'
    }
    buildTypes {
        release { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Same input as build.sh: the command limit (-PnaviMaxCommand=N, default 10240; must be at least the
// computer's MAX_COMMAND).
def naviMaxCommand = (project.findProperty('naviMaxCommand') ?: '10240').toString()
if (!(naviMaxCommand ==~ /[0-9]{3,5}/) || naviMaxCommand.toInteger() < 512 || naviMaxCommand.toInteger() > 16384)
    throw new GradleException('naviMaxCommand must be a number from 512 to 16384')
def naviGenerated = layout.buildDirectory.dir('generated/navi/java')
tasks.register('naviLimits') {
    inputs.property('maxCommand', naviMaxCommand)
    outputs.dir(naviGenerated)
    doLast {
        def file = naviGenerated.get().file('in/akuj/fingerprint/Limits.java').asFile
        file.parentFile.mkdirs()
        file.text = "package in.akuj.fingerprint;\n\n/** Generated from naviMaxCommand. */\nfinal class Limits {\n" +
                "    static final int MAX_COMMAND = ${naviMaxCommand};\n    private Limits() { }\n}\n"
    }
}
android.sourceSets.main.java.srcDir naviGenerated
preBuild.dependsOn 'naviLimits'
